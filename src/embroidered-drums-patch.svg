<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180">
  <defs>
    <!-- Realistic Embroidery Thread & Satin Stitch Texture Filter -->
    <filter id="satin-stitch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15 0.95" numOctaves="3" result="threadNoise" />
      <feDisplacementMap in="SourceGraphic" in2="threadNoise" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="stitched" />
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#111111" flood-opacity="0.28" />
    </filter>

    <filter id="patch-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1a1815" flood-opacity="0.32" />
    </filter>

    <!-- Dense Parallel Satin Stitch Pattern for Single-Color Crimson Drum Shell -->
    <pattern id="crimson-satin-threads" width="6" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="6" height="4" fill="#d81b60" />
      <line x1="0" y1="1" x2="6" y2="1" stroke="#ad1457" stroke-width="1.1" />
      <line x1="0" y1="3" x2="6" y2="3" stroke="#f06292" stroke-width="0.7" opacity="0.65" />
    </pattern>

    <!-- Cream Twill Satin Stitch Pattern for Drumhead -->
    <pattern id="cream-twill-threads" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="5" height="5" fill="#f5efe0" />
      <line x1="0" y1="2" x2="5" y2="2" stroke="#e2d9c5" stroke-width="1.2" />
      <line x1="0" y1="4" x2="5" y2="4" stroke="#ffffff" stroke-width="0.8" />
    </pattern>

    <!-- Warm Beige Felt Backing Pattern -->
    <pattern id="felt-weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fcfaf2" />
      <circle cx="1" cy="1" r="0.6" fill="#ede6d3" />
      <circle cx="3" cy="3" r="0.6" fill="#ede6d3" />
    </pattern>
  </defs>

  <!-- Warm Linen Background matching thread-icons.jpg (#fcfaf2) -->
  <rect width="220" height="180" rx="18" fill="#fcfaf2" />

  <!-- Outer Die-Cut Cream Felt Patch Base with Soft Cast Shadow (Exactly like the Ticket & Tent patches) -->
  <g filter="url(#patch-shadow)">
    <rect x="16" y="14" width="188" height="152" rx="28" fill="#f3ebd8" stroke="#dfd4bc" stroke-width="3" />
    <!-- Merrowed Overlock Cream Thread Border -->
    <rect x="20" y="18" width="180" height="144" rx="24" fill="#faf6eb" stroke="#c8bca2" stroke-width="3.5" stroke-dasharray="3,2.5" />
    <!-- Inner Black Stitched Frame Line -->
    <rect x="27" y="25" width="166" height="130" rx="18" fill="none" stroke="#1e1c1a" stroke-width="3.5" stroke-dasharray="5,2.5" />
  </g>

  <!-- Hand-Stitched Embroidered Single-Color Drum Kit & Crossed Drumsticks -->
  <g filter="url(#satin-stitch)">
    <!-- Crossed Wooden Drumsticks Behind Snare (Cream & Dark Charcoal Thread) -->
    <g stroke-linecap="round">
      <!-- Stick 1 -->
      <line x1="54" y1="38" x2="164" y2="136" stroke="#1e1c1a" stroke-width="11" />
      <line x1="54" y1="38" x2="164" y2="136" stroke="#e9dec5" stroke-width="6" stroke-dasharray="4,1.5" />
      <ellipse cx="52" cy="36" rx="6" ry="4.5" transform="rotate(42 52 36)" fill="#d81b60" stroke="#1e1c1a" stroke-width="2.5" />

      <!-- Stick 2 -->
      <line x1="166" y1="38" x2="56" y2="136" stroke="#1e1c1a" stroke-width="11" />
      <line x1="166" y1="38" x2="56" y2="136" stroke="#e9dec5" stroke-width="6" stroke-dasharray="4,1.5" />
      <ellipse cx="168" cy="36" rx="6" ry="4.5" transform="rotate(-42 168 36)" fill="#d81b60" stroke="#1e1c1a" stroke-width="2.5" />
    </g>

    <!-- Snare / Tom Drum Cylinder Body (Single Color Deep Raspberry-Crimson Satin Thread) -->
    <path
      d="M52 72 L168 72 L162 124 C162 138, 58 138, 58 124 Z"
      fill="url(#crimson-satin-threads)"
      stroke="#1e1c1a"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- Embroidered Zigzag Tension Lugs Across the Drum Shell -->
    <polyline
      points="60,86 74,120 90,88 110,122 130,88 146,120 160,86"
      fill="none"
      stroke="#1e1c1a"
      stroke-width="4"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <polyline
      points="60,86 74,120 90,88 110,122 130,88 146,120 160,86"
      fill="none"
      stroke="#faf6eb"
      stroke-width="2"
      stroke-dasharray="3,2"
      stroke-linejoin="round"
    />

    <!-- Bottom Drum Hoop Rim -->
    <path
      d="M56 121 C56 137, 164 137, 164 121"
      fill="none"
      stroke="#1e1c1a"
      stroke-width="6"
      stroke-linecap="round"
    />
    <path
      d="M58 121 C58 135, 162 135, 162 121"
      fill="none"
      stroke="#d81b60"
      stroke-width="2.5"
      stroke-dasharray="4,2"
    />

    <!-- Top Drumhead Oval (Cream Twill Embroidery with Stitched Inner Ring) -->
    <ellipse
      cx="110"
      cy="72"
      rx="58"
      ry="20"
      fill="url(#cream-twill-threads)"
      stroke="#1e1c1a"
      stroke-width="4.5"
    />
    <!-- Inner Stitched Bullseye Ring on Drumhead (Single Color Crimson Thread) -->
    <ellipse
      cx="110"
      cy="72"
      rx="44"
      ry="13"
      fill="none"
      stroke="#d81b60"
      stroke-width="2.8"
      stroke-dasharray="5,3"
    />
    <!-- Center Embroidered Star / Beat Emblem on Drumhead -->
    <polygon
      points="110,63 113,69 120,70 115,74 116,80 110,77 104,80 105,74 100,70 107,69"
      fill="#d81b60"
      stroke="#1e1c1a"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
  </g>
</svg>
