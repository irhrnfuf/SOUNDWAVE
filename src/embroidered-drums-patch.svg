<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Felt / Linen Texture Filter -->
    <filter id="felt-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.97  0 0 0 0 0.94  0 0 0 0.08 0" result="col" />
      <feComposite in="SourceGraphic" in2="col" operator="over" />
    </filter>
  </defs>

  <!-- Warm Off-White Rounded Fabric Patch Base -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="#fffdf7" stroke="#111111" stroke-width="3" filter="url(#felt-texture)" />
  
  <!-- Outer Hand-Stitched Running Thread Border -->
  <rect x="14" y="14" width="132" height="132" rx="22" fill="none" stroke="#ff3366" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Single-Color Drum Set (Snare Drum + Crossed Drumsticks + Cymbals in monochromatic Crimson #ff3366) -->
  <g transform="translate(80, 80)">
    <!-- High-Hat / Cymbal Stand & Disc -->
    <line x1="-36" y1="-12" x2="-36" y2="42" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <path d="M-52 -14 Q-36 -24 -20 -14 Z" fill="#ff3366" stroke="#111111" stroke-width="2.5" />
    <!-- Cymbal Hand-Stitched Highlight -->
    <path d="M-46 -15 Q-36 -21 -26 -15" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3,2" />

    <!-- Crash Cymbal -->
    <line x1="38" y1="-18" x2="38" y2="42" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <path d="M22 -20 Q38 -32 54 -20 Z" fill="#ff3366" stroke="#111111" stroke-width="2.5" />
    <path d="M28 -21 Q38 -29 48 -21" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3,2" />

    <!-- Crossed Drumsticks (Behind Main Snare) -->
    <line x1="-34" y1="-32" x2="34" y2="34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="-34" y1="-32" x2="34" y2="34" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    <circle cx="-34" cy="-32" r="3.5" fill="#111111" />

    <line x1="34" y1="-32" x2="-34" y2="34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="34" y1="-32" x2="-34" y2="34" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    <circle cx="34" cy="-32" r="3.5" fill="#111111" />

    <!-- Main Snare Drum Body (Single Color Crimson/Dark Pink #ff3366) -->
    <path d="M-30 0 L30 0 L26 28 L-26 28 Z" fill="#ff3366" stroke="#111111" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Snare Rim Top Oval -->
    <ellipse cx="0" cy="0" rx="30" ry="11" fill="#ffffff" stroke="#111111" stroke-width="3.5" />
    <!-- Embroidered Drumhead Stitches -->
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="#ff3366" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Snare Tension Rods (Vertical Embroidery Thread Lines) -->
    <line x1="-20" y1="9" x2="-18" y2="28" stroke="#111111" stroke-width="2.5" />
    <circle cx="-19" cy="18" r="2" fill="#ffffff" stroke="#111111" stroke-width="1.2" />

    <line x1="0" y1="11" x2="0" y2="28" stroke="#111111" stroke-width="2.5" />
    <circle cx="0" cy="19" r="2" fill="#ffffff" stroke="#111111" stroke-width="1.2" />

    <line x1="20" y1="9" x2="18" y2="28" stroke="#111111" stroke-width="2.5" />
    <circle cx="19" cy="18" r="2" fill="#ffffff" stroke="#111111" stroke-width="1.2" />

    <!-- Tripod Base Legs -->
    <line x1="0" y1="28" x2="0" y2="46" stroke="#111111" stroke-width="3.5" />
    <line x1="0" y1="46" x2="-18" y2="54" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="46" x2="18" y2="54" stroke="#111111" stroke-width="3" stroke-linecap="round" />

    <!-- Decorative Hand-Stitched Little Music Star / Sparkle in Top Left -->
    <path d="M-42 -38 L-40 -34 L-36 -33 L-40 -31 L-41 -27 L-43 -31 L-47 -32 L-43 -34 Z" fill="#ff3366" stroke="#111111" stroke-width="1" />
    <path d="M42 -36 L43 -32 L47 -31 L43 -29 L42 -25 L40 -29 L36 -30 L40 -32 Z" fill="#ff3366" stroke="#111111" stroke-width="1" />
  </g>
</svg>
